[versions]
agp = "8.6.1"
kotlin = "2.1.10"
compose-bom = "2025.02.00"
activityCompose = "1.10.0"
lifecycle = "2.8.7"
navigation = "2.8.7"
hilt = "2.52"
room = "2.6.1"
coroutines = "1.9.0"
serialization = "1.7.3"
ksp = "2.1.10-1.0.31"
supabase = "3.6.0"
ktor = "3.1.1"
datastore = "1.1.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
